services:
  # The Mail Delivery Agent (Dovecot) is responsible for storing
  # incoming mail into a users mailbox and also delivers them
  # via POP3 or IMAP4.
  mda:
    image: jeboehm/mailserver-mda:latest
    build:
      context: ../../target/mda
      cache_from:
        - type=registry,ref=ghcr.io/jeboehm/mailserver-mda:buildcache
    restart: always
    env_file: ../../.env
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      # Accepts the former MYSQL_* names as a fallback.
      DB_HOST: ${DB_HOST:-${MYSQL_HOST:-db}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-mailserver}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-}}
      DB_PORT: ${DB_PORT:-${MYSQL_PORT:-3306}}
      DB_TLS_VERIFY_CERT: ${DB_TLS_VERIFY_CERT:-${MYSQL_TLS_VERIFY_CERT:-no}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-mailserver}}
    tmpfs:
      - /tmp:mode=0755,uid=1000,gid=1000
      - /run/dovecot:mode=0755,uid=1000,gid=1000
    security_opt:
      - no-new-privileges
    read_only: true
    depends_on:
      - db
    volumes:
      - data-mail:/srv/vmail
      ## 2025-11-26 BW Remove built in TLS to use Let's Encrypt instead
      #- data-tls:/etc/dovecot/tls:ro
      # For using external certificates uncomment the following lines
      # and change the path on the left side of the colon.
      - /etc/letsencrypt/live/her.qxtl.net/fullchain.pem:/etc/dovecot/tls/tls.crt:ro
      - /etc/letsencrypt/live/her.qxtl.net/privkey.pem:/etc/dovecot/tls/tls.key:ro
    ports:
      - "0.0.0.0:143:31143"
      - "0.0.0.0:993:31993"
      - "0.0.0.0:110:31110"
      - "0.0.0.0:995:31995"

