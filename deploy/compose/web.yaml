services:
  # The admin (mailserver-admin) and webmail (roundcube) interfaces
  # live in the web service. Required for provisioning the database.
  web:
    image: jeboehm/mailserver-web:latest
    build:
      context: ../../target/web
      args:
        # Roundcube plugins can be added here.
        # Documentation available at docs/how-to/configure-roundcube-plugins.md
        RC_PLUGINS: "johndoh/contextmenu jfcherng-roundcube/show-folder-size"
      cache_from:
        - type=registry,ref=ghcr.io/jeboehm/mailserver-web:buildcache
    restart: always
    env_file: ../../.env
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_SERVER_VERSION: ${DB_SERVER_VERSION:-8.4}
      # Accepts the former MYSQL_* names as a fallback.
      DB_HOST: ${DB_HOST:-${MYSQL_HOST:-db}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-mailserver}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-}}
      DB_PORT: ${DB_PORT:-${MYSQL_PORT:-3306}}
      DB_USER: ${DB_USER:-${MYSQL_USER:-mailserver}}
    security_opt:
      - no-new-privileges
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /opt/admin/var/cache/prod:mode=0777
      - /opt/admin/var/log:mode=0777
      - /opt/roundcube/temp:mode=0777
      - /opt/roundcube/logs:mode=0777
      - /tmp:mode=0777
    volumes:
      ## 2025-11-26 BW Remove built in TLS to use Let's Encrypt instead
      #- data-tls:/etc/dovecot/tls:ro
      # For using external certificates uncomment the following lines
      # and change the path on the left side of the colon.
      - /etc/letsencrypt/live/her.qxtl.net/fullchain.pem:/etc/dovecot/tls/tls.crt:ro
      - /etc/letsencrypt/live/her.qxtl.net/privkey.pem:/etc/dovecot/tls/tls.key:ro

networks:
  default:
    name: $DOCKER_CADDY_NETWORK
    external: true

